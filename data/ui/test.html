<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>NeonScript panel test</title>
<style>html,body{margin:0;background:#101018;color:#9ef;font:14px Segoe UI,sans-serif}h1{margin:12px}</style>
</head><body>
<h1 id="h">Hello from the panel</h1>
<script>
chrome.webview.postMessage('ready:' + location.href);
chrome.webview.addEventListener('message', function (e) {
  document.getElementById('h').textContent = e.data;
  chrome.webview.postMessage('echo:' + e.data);
});
</script>
</body></html>
