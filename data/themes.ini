; NeonScript themes.
; colors = 31 palette indices (0-98) in mIRC's Colors-dialog order:
;   Background, Action, Ctcp, Highlight, Info, Info2, Invite, Join, Kick, Mode,
;   Nick, Normal, Notice, Notify, Other, Own, Part, Quit, Topic, Wallops, Whois,
;   Editbox, Editbox text, Listbox, Listbox text, Gray text, Title text, Inactive,
;   Treebar, Treebar Text, MDI area
; Indices 16-98 are the standard extended IRC colours, so no palette is changed.
; accent = palette index used for NeonScript's own prefix; acc1/acc2 = dashboard gradient.

[themes]
order=neonnight,synthwave,matrix,amber,midnight,slate,paper,classic

